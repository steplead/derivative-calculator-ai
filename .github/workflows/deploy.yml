name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://derivativecalculatorai.com

      - name: Build for Cloudflare Pages
        # Produces .vercel/output/static (the Pages deployment artifact)
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        # Replaced deprecated cloudflare/pages-action@v1 with the official
        # `wrangler pages deploy` command (Cloudflare's current recommendation).
        # This gives clearer error output and native wrangler 3.x support.
        run: npx wrangler@latest pages deploy .vercel/output/static --project-name=derivative-calculator-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
