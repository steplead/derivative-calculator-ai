# Deploy to Cloudflare Pages
#
# IMPORTANT (single source of truth):
# This repo has TWO deploy mechanisms that both fire on push to `main`:
#   1. This GitHub Actions workflow (wrangler pages deploy)  <-- authoritative deployer
#   2. Cloudflare Pages' native GitHub integration (auto-deploy on push)
# Both create competing Production deployments for the same commit. They build identical
# output, but the race can leave the active production deployment pointing at a not-yet-promoted
# build (observed on de8d3b5: production returned stale code until the build settled).
# To make "push -> auto-deploy to production" deterministic, DISABLE the native integration's
# auto-deploy in Cloudflare Dashboard:
#   Workers & Pages -> derivative-calculator-ai -> Settings -> Builds & deployments ->
#   disable "Automatic deploys" (or set Production branch to a branch that is never pushed).
# Keep this workflow as the only deployer.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://derivativecalculatorai.com

      - name: Build for Cloudflare Pages
        # Produces .vercel/output/static (the Pages deployment artifact)
        run: npx @cloudflare/next-on-pages

      - name: Verify Cloudflare credentials
        # Fail fast with a clear message if the required repo secrets are missing,
        # instead of an obscure wrangler auth error during deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret(s). Set CLOUDFLARE_API_TOKEN (Cloudflare 'Pages:Edit' permission) and CLOUDFLARE_ACCOUNT_ID in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        # Replaced deprecated cloudflare/pages-action@v1 with the official
        # `wrangler pages deploy` command (Cloudflare's current recommendation).
        # - uses the project-pinned wrangler (devDependency ^3.57.1) for reproducible builds
        # - --branch=main promotes the build to the Pages production branch
        # - --commit-dirty=true never blocks deploy on generated files (e.g. lib/noindex-slugs.ts from prebuild)
        run: npx wrangler pages deploy .vercel/output/static --project-name=derivative-calculator-ai --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
